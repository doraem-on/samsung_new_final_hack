<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui;
      background: #f6f8fb;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: white;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #0b5cff; color: white; }
    .secondary { background: #e9ecef; }
    #output {
      white-space: pre-wrap;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="card">
  <h3>Vessel – Local Agent</h3>
  <div id="counter">Indexed pages: 0</div>
</div>

<div class="card">
  <button id="indexBtn" class="primary">Index Current Page</button>
</div>

<div class="card">
  <textarea id="query" rows="3" placeholder="Ask the agent..."></textarea>
  <button id="askBtn" class="primary">Ask Agent</button>
</div>

<div class="card">
  <button id="highlightBtn" class="secondary">Highlight Username</button>
  <button id="fillBtn" class="secondary">Fill Username (Demo)</button>
</div>

<div class="card">
  <div id="output">Waiting for input...</div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
