<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vessel – Local Agent</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 14px;
    background: #f4f6f8;
    color: #2c3e50;
  }

  h2 {
    margin-top: 0;
    font-size: 18px;
  }

  .card {
    background: #ffffff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .status {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: none;
    background: #0066ff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary {
    background: #eaecef;
    color: #333;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    resize: none;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 6px;
  }

  pre {
    white-space: pre-wrap;
    font-size: 13px;
    background: #f8f9fa;
    padding: 8px;
    border-radius: 6px;
    min-height: 80px;
  }

  .label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Vessel – Local Agent</h2>
  <div class="status" id="statusText">Ready.</div>
</div>

<div class="card">
  <div class="label">Page Control</div>
  <button id="indexBtn">Index Current Page</button>
</div>

<div class="card">
  <div class="label">Ask Agent (Local Reasoning)</div>
  <textarea id="askInput" rows="3" placeholder="Ask based on indexed pages..."></textarea>
  <button id="askBtn">Ask</button>
</div>

<div class="card">
  <div class="label">Agent Actions</div>
  <button class="secondary" id="highlightBtn">Highlight Username Field</button>
</div>

<div class="card">
  <div class="label">Agent Output</div>
  <pre id="output">Waiting for input…</pre>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
