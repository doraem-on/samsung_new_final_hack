<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Agent</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* --- GLOBAL STYLES --- */
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      /* Background Image */
      background: url('icons/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      
      /* ENABLE SCROLLING */
      height: 100vh;
      overflow-y: auto; 
      
      display: flex;
      flex-direction: column;
      padding: 20px;
      padding-bottom: 40px; 
      box-sizing: border-box;
    }

    /* --- MODERN SCROLLBAR --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }

    /* --- GLASS CARDS --- */
    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-bottom: 24px; 
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    /* --- TYPOGRAPHY --- */
    h2 { 
      margin: 0; 
      font-size: 16px; 
      font-weight: 700; 
      color: #1a1a1a; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    h2 i { color: #0062E6; } 

    p.status {
      font-size: 13px; color: #666; margin: 5px 0 15px 0; display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 8px; height: 8px; background-color: #00c851; border-radius: 50%; display: inline-block;
    }

    /* --- BUTTONS --- */
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }

    .btn-primary { background: linear-gradient(135deg, #0062E6, #33AEFF); color: white; box-shadow: 0 4px 15px rgba(0, 98, 230, 0.2); }
    .btn-secondary { background: #f0f2f5; color: #444; border: 1px solid #e1e1e1; }
    .btn-share { background: linear-gradient(135deg, #5b2eea, #8a58f2); color: white; }

    /* --- INPUTS --- */
    textarea {
      width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid #e0e0e0;
      padding: 12px; font-family: inherit; font-size: 13px; resize: none; background: #f9f9f9; outline: none; margin-bottom: 5px;
    }
    textarea:focus { border-color: #33AEFF; background: #fff; }

    /* --- TOGGLES --- */
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    input[type="checkbox"] { accent-color: #0062E6; transform: scale(1.2); cursor: pointer; }

    /* --- KNOX VAULT OVERLAY --- */
    #vault-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.98); z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .vault-icon { font-size: 36px; color: #666; margin-bottom: 15px; }
    .vault-text { font-size: 13px; color: #888; margin-bottom: 20px; }

    /* QR Container */
    .qr-container {
      margin-top: 15px; padding: 10px; background: white; border-radius: 12px;
      display: none; text-align: center; animation: fadeIn 0.3s;
    }
    #qr-code img { margin: 0 auto; }
    .scan-hint { font-size: 12px; color: #888; margin-top: 8px; }

    /* --- HEADER ROW (For Reset/Eco Icons) --- */
    .card-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }
    .eco-badge {
      font-size: 11px; background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; gap: 5px; font-weight: 600;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- DESKTOP / DEX MODE --- */
    @media (min-width: 600px) {
      body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; }
      .glass-card:nth-child(1) { grid-column: span 2; } 
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div id="vault-overlay">
      <i class="fa-solid fa-shield-cat vault-icon"></i>
      <h3 style="margin:0;">Knox Vault</h3>
      <p class="vault-text">Agent memory is encrypted.</p>
      <button id="authBtn" class="btn-primary" style="background: #222; width: auto; padding: 10px 20px;">
        <i class="fa-solid fa-fingerprint"></i> Unlock
      </button>
    </div>

    <div id="agent-content" style="filter: blur(5px); opacity: 0.5; pointer-events: none;">
      <div class="card-header" style="margin-bottom: 5px;">
        <h2><i class="fa-solid fa-brain"></i> Vessel Agent</h2>
        <i id="resetBtn" class="fa-solid fa-rotate-right" style="cursor:pointer; color:#aaa; font-size: 14px;" title="Reset Memory"></i>
      </div>
      
      <p class="status"><span class="status-dot"></span> System Ready</p>
      <div id="counter" style="font-size: 12px; color: #555; margin-bottom: 12px;">Indexed pages: 0</div>
      
      <button id="indexBtn" class="btn-primary">
        <i class="fa-solid fa-bolt"></i> Index Page
      </button>
    </div>
  </div>

  <div class="glass-card">
    <div class="card-header" style="margin-bottom: 10px;">
       <h2 style="font-size: 14px; color:#555;">Ask AI</h2>
       <i id="voiceToggle" class="fa-solid fa-volume-xmark" style="color:#aaa; cursor:pointer; font-size:16px;" title="Read Aloud"></i>
    </div>

    <textarea id="query" rows="2" placeholder="Ask about this page..."></textarea>
    <button id="askBtn" class="btn-primary">
      <i class="fa-solid fa-paper-plane"></i> Ask Agent
    </button>
    <div id="output" style="margin-top: 10px; font-size: 13px; color: #333; line-height: 1.4;"></div>
  </div>

  <div class="glass-card">
    <div class="card-header">
      <h2><i class="fa-solid fa-shield-halved"></i> Active Defense</h2>
      <span class="eco-badge">
        <i class="fa-solid fa-leaf"></i> <span id="trackerCount">0</span>
      </span>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label"><i class="fa-solid fa-eye-slash"></i> Screen Shield (Blur PII)</span>
      <input type="checkbox" id="shieldToggle">
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><i class="fa-solid fa-link"></i> Link Detox</span>
      <input type="checkbox" checked disabled title="Always Active">
    </div>
  </div>

  <div class="glass-card">
    <h2><i class="fa-solid fa-share-nodes"></i> Galaxy Ecosystem</h2>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="quickShareBtn" class="btn-share">
        <i class="fa-solid fa-share-from-square"></i> Quick Share
      </button>
      <button id="qrBtn" class="btn-secondary" style="width: 50px;" title="Show QR Code">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>
    
    <div id="qr-code" class="qr-container">
      <div class="scan-hint">Scan with Samsung Camera</div>
    </div>
  </div>

  <div class="glass-card">
    <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Form Assistant</h2>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="highlightBtn" class="btn-secondary">
        <i class="fa-solid fa-highlighter"></i> Find
      </button>
      <button id="fillBtn" class="btn-secondary">
        <i class="fa-solid fa-pen-to-square"></i> Auto-Fill
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
