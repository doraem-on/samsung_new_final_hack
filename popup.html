<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Vessel Agent</title>
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 10px 0;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f5f5f5;
    }

    button:hover {
      background: #eaeaea;
    }

    #output {
      font-size: 12px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      padding: 6px;
      min-height: 60px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1>Vessel Agent</h1>

  <button id="indexBtn">Index Page</button>
  <button id="summarizeBtn">Summarize</button>
  <button id="highlightBtn">Highlight Username</button>

  <div id="output">Idle.</div>

  <script src="popup.js"></script>
</body>
</html>
